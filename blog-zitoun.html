<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#2B2420"/>
    <path d="M30 85 V50 A20 20 0 0 1 70 50 V85 Z" fill="#C1602A"/>
    <rect x="30" y="70" width="40" height="15" fill="#2B2420"/>
  </svg>
</template>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Work+Sans:wght@300;400;500;600&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #F7F1E8; }
    a { color: inherit; text-decoration: none; }
    a:hover { opacity: 0.75; }
  </style>
</helmet>

<div style="font-family:'Work Sans',sans-serif;color:#2B2420;background:#F7F1E8;min-height:100vh;">

  <header style="position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:16px clamp(20px,5vw,64px);background:rgba(247,241,232,0.92);backdrop-filter:blur(6px);border-bottom:1px solid rgba(43,36,32,0.1);">
    <a href="index.html" style="font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;letter-spacing:0.5px;">Dar Najat</a>
    <nav style="display:flex;align-items:center;gap:clamp(14px,2.5vw,32px);">
      <a href="index.html#rooms" style="font-size:15px;">Chambres</a>
      <a href="index.html#restaurant" style="font-size:15px;">Restaurant</a>
      <a href="blog.html" style="font-size:15px;font-weight:600;color:#C1602A;">Blog</a>
      <a href="index.html#contact" style="font-size:15px;">Contact</a>
      <a href="https://www.riaddarnajat.com/reservation-en-ligne.html" target="_blank" style="font-size:14px;font-weight:600;padding:9px 20px;border-radius:24px;color:#fff;background:#C1602A;white-space:nowrap;">Réserver</a>
    </nav>
  </header>

  <div style="padding:24px 0;">
    <div style="max-width:820px;margin:0 auto;padding:0 24px 12px;font-size:13px;">
      <a href="blog.html" style="color:#b45309;">← Retour au blog</a>
    </div>
  </div>

  <section style="max-width:820px;margin:0 auto;padding:0 24px 24px;">
    <header style="margin:0 0 32px;">
      <div style="font-size:13px;letter-spacing:2.5px;font-weight:600;color:#C1602A;margin-bottom:16px;">ZITOUN</div>
      <h1 style="margin:0 0 14px;font-size:clamp(30px,5vw,40px);line-height:1.2;font-family:'Cormorant Garamond',serif;font-weight:600;">Zitoun</h1>
    </header>

    <div id="owm-fiche-wrap" style="width:380px;max-width:100%;margin:0 auto 40px;">
      <iframe id="owm-fiche-frame" src="https://oneworldmorocco.com/b/riad-dar-najat?embed=1&amp;bg=transparent&amp;card=F7F1E8" style="width:100%;display:block;height:1200px;border:0;border-radius:24px;background:transparent;overflow:hidden;" title="Fiche — Riad Dar Najat" loading="lazy" allow="clipboard-write" scrolling="no"></iframe>
    </div>

    <div style="margin:0 0 40px;">
      <iframe src="https://oneworldmorocco.com/embed/fiche/riad-dar-najat?lang=fr&amp;bg=transparent" style="width:100%;display:block;height:900px;border:0;border-radius:20px;background:transparent;" title="Fiche 1WM — Riad Dar Najat" loading="lazy" allow="clipboard-write; geolocation"></iframe>
    </div>

    <div style="margin:0 auto 40px;max-width:560px;">
      <iframe src="https://oneworldmorocco.com/embed/spotify/riad-dar-najat?theme=light&amp;bg=transparent" style="width:100%;display:block;max-width:560px;height:372px;border:0;border-radius:16px;background:transparent;" title="Spotify — Riad Dar Najat" loading="lazy" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
    </div>

    <div style="margin:0 auto 40px;max-width:560px;">
      <iframe src="https://oneworldmorocco.com/embed/soundcloud/riad-dar-najat?visual=1&amp;bg=transparent" style="width:100%;display:block;max-width:560px;height:420px;border:0;border-radius:16px;background:transparent;" title="SoundCloud — Riad Dar Najat" loading="lazy" allow="autoplay"></iframe>
    </div>
  </section>

  <div style="position:fixed;right:clamp(14px,3vw,28px);bottom:clamp(20px,4vh,40px);z-index:60;display:flex;flex-direction:column;gap:10px;">
    <button onClick="{{ scrollTop }}" aria-label="Remonter en haut" style="width:44px;height:44px;border:none;border-radius:50%;background:#2B2420;color:#F7F1E8;font-size:18px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,0.25);display:flex;align-items:center;justify-content:center;">↑</button>
    <button onClick="{{ scrollBottom }}" aria-label="Descendre en bas" style="width:44px;height:44px;border:none;border-radius:50%;background:#2B2420;color:#F7F1E8;font-size:18px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,0.25);display:flex;align-items:center;justify-content:center;">↓</button>
  </div>

  <div style="width:100%;background:#EFE6D8;">
    <iframe id="owm-weather-footer" src="https://oneworldmorocco.com/embed/weather?city=Marrakech&amp;lang=fr&amp;layout=footer&amp;days=3&amp;bg=EFE6D8" style="width:100%;display:block;height:96px;border:0;border-radius:0px;background:transparent" title="Météo — Marrakech" loading="lazy"></iframe>
  </div>

  <footer style="padding:40px clamp(20px,5vw,64px);background:#2B2420;color:rgba(247,241,232,0.85);display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;">
    <div style="font-family:'Cormorant Garamond',serif;font-size:18px;">Riad Dar Najat — Marrakech</div>
    <div style="font-size:12.5px;opacity:0.7;">© 2026 Riad Dar Najat. Tous droits réservés.</div>
  </footer>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      scrollTop: () => window.scrollTo({ top: 0, behavior: 'smooth' }),
      scrollBottom: () => window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' }),
    };
  }
  componentDidMount() {
    this._weatherHeightHandler = (e) => {
      if (!e.data || e.data.type !== 'owm-weather-height') return;
      const f = document.getElementById('owm-weather-footer');
      if (f) f.style.height = Math.ceil(e.data.height) + 'px';
    };
    window.addEventListener('message', this._weatherHeightHandler);
    this._ficheHeightHandler = (e) => {
      if (!e.data || e.data.type !== 'owm-fiche-height') return;
      const f = document.getElementById('owm-fiche-frame');
      if (f && f.contentWindow === e.source) f.style.height = (e.data.height + 8) + 'px';
    };
    window.addEventListener('message', this._ficheHeightHandler);
  }
  componentWillUnmount() {
    window.removeEventListener('message', this._ficheHeightHandler);
    window.removeEventListener('message', this._weatherHeightHandler);
  }
}

</script>
</body>
</html>
